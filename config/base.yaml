zotero:
  user_id: ??? # Zotero 账号的用户 ID。
  api_key: ??? # 具有读取权限的 Zotero API Key。
  include_path: null # 要纳入语料库的 Zotero 收藏夹路径 glob 规则列表。示例：["2026/survey/**","2026/reading-group/**"]
  ignore_path: null # 要排除的 Zotero 收藏夹路径 glob 规则列表。示例：["2026/ignore/**","archive/**"]

source:
  arxiv:
    category: null # 目标 arXiv 分类。可在 https://arxiv.org/category_taxonomy 查询领域缩写。示例：["cs.AI","cs.CV","cs.LG","cs.CL"]
    include_cross_list: true # 是否包含订阅分类中的 arXiv 交叉列表论文。示例：true

email:
  enabled: false # 是否启用旧 SMTP 邮件链路。默认关闭；Resend 不受此开关影响。
  sender: ??? # 用于发送邮件的邮箱账号。示例：abc@qq.com
  receiver: ??? # 接收论文列表的邮箱账号。示例：abc@outlook.com
  smtp_server: ??? # 发件邮箱的 SMTP 服务器，可向邮箱服务商查询。示例：smtp.qq.com
  smtp_port: ??? # SMTP 服务器端口。示例：465
  smtp_timeout_seconds: 20 # SMTP 连接、登录和发送的超时时间，避免网络异常时一直卡住。示例：20
  sender_password: ??? # 发件邮箱的 SMTP 密码或授权码，通常不是邮箱登录密码。示例：abcdefghijklmn

resend_email:
  enabled: false # 是否启用 Resend 邮件发送。示例：true
  api_key: ??? # Resend API Key (re_xxxxx)，用作 SMTP 密码。
  sender_name: "arXiv Daily" # Resend 发件人显示名称。
  sender_email: "daily@nickelates.uk" # Resend 发件人邮箱地址（需在 Resend 中验证的域名）。
  smtp_server: "smtp.resend.com" # Resend SMTP 服务器。
  smtp_port: 465 # Resend SMTP 端口 (SSL)。
  smtp_timeout_seconds: 20 # SMTP 连接超时时间。
  recipients_zh: [] # 中文版日报收件人列表。在 custom.yaml 中通过环境变量配置。
  recipients_zh_hant: [] # 繁体中文版日报收件人列表。在 custom.yaml 中通过环境变量配置。
  recipients_en: [] # 英文版日报收件人列表。在 custom.yaml 中通过环境变量配置。
  unsubscribe_note: "To unsubscribe, email support@nickelates.uk with subject 'unsubscribe'." # 退订说明。

llm:
  api:
    key: ??? # 大模型 API Key。示例：sk-xxx
    base_url: ??? # 大模型 API 地址。示例：https://api.openai.com/v1
  generation_kwargs:
  # 传给大模型 Chat Completions 接口的参数，可参考 OpenAI API 文档。
    max_tokens: 393216
    model: ???
  language: English # TL;DR 摘要的首选语言。示例：English

prompt:
  topic: "nickelate superconductors" # AI 生成每日概览时关注的研究主题。
  role: "专业的学术编辑" # AI 生成内容时扮演的角色。
  overview_zh: "请根据以下关联度较高的论文信息（包含标题、作者、机构和摘要），为今天的 {topic} 领域论文速览生成一段整体介绍。该介绍将被放在每日推送文章的开头，请用专业的口吻，大概总结一下今天的研究亮点。请你注意，今天有可能没有 {topic} 领域的内容；如有，或有少数篇涉及到一点点与之有关的，都请总结关联点。在你总结时，无需面面俱到，只需简单介绍其亮点和主要结论即可。语言要求简洁、专业，以一整段话输出，不要分段、不要做自我介绍和项目介绍。例如： 好的，根据您提供的论文列表，今天的每日速览中，确实有直接关于 nickelate superconductors 领域的研究。同时，也有几篇虽然不直接以镍酸盐为研究对象，但其探讨的物理机制或研究方法与镍基超导领域当前的核心问题高度相关，值得重点关注。 以下是为今日推文准备的整体介绍： — 各位读者好，欢迎阅读今日的镍基超导领域论文速览。 今日的亮点工作聚焦于对混合型Ruddlesden-Popper镍酸盐电子结构的深入理解。在[1]中，一项基于DFT+D……只要从“今日的亮点工作聚焦于对混合型Ruddlesden-Popper镍酸盐电子结构的深入理解。”开始输出即可。"
  translation_en: "Please translate the following Chinese daily paper overview into professional English. Only output the translated English text:"
  translation_zh_hant: "請將以下中文每日論文速覽翻譯成自然、專業的繁體中文。只輸出翻譯正文："

domain:
  topic: "nickelate superconductors" # 领域判定主题；默认与 prompt.topic 保持一致。
  use_ai: true # 是否启用 LLM 二次领域判定；关闭时 longlist 全部视为命中。
  ai_confidence_threshold: 0.5 # LLM 判定为 accept 时进入规范化收录的最低置信度。
  uncertain_policy: audit_only # uncertain 论文只写审计文件，不进入展示或知识库。
  canonical_vocabulary_path: null # 可选 AKB 规范词表路径，用于辅助领域判定。

capture:
  enabled: true # 是否输出规范化 capture 数据包。
  output_dir: data/capture # capture 根目录。
  fulltext_dir: data/capture/fulltext # PDF/TXT/meta 输出目录。
  save_pdf: true # accepted arXiv 论文保存 PDF。
  save_full_text: true # accepted arXiv 论文保存 TXT；全文失败时用摘要兜底并在 meta 中记录。
  save_meta: true # accepted arXiv 论文保存抓取/抽取审计记录。
  save_rejected_candidates: true # rejected/uncertain 候选保存到审计 JSONL。
  id_priority: ["arxiv", "doi", "title"] # 稳定编号优先级。

knowledge:
  enabled: true # 是否在每日 accepted/fulltext 完成后增量更新知识库。
  output_dir: null # 默认写到 Hugo/前端仓库的 data/knowledge；没有 Hugo 时写 data/knowledge。
  capture_dir: null # 默认复用 capture.output_dir。
  batch_size: 16 # 知识抽取 LLM 批大小。
  full_text_char_budget: 120000 # 每篇论文送入知识抽取前的全文字符预算。
  non_blocking: true # 知识库失败不阻塞日报发布。
  run_alignment: true # 增量更新后运行 canonical vocabulary alignment。
  run_vocabulary_review: false # 每日增量默认跳过慢速 vocabulary 重复审查；需要清理词表时手动开启。
  vocabulary_review_max_terms_per_type: 250
  align_max_facets: 100
  align_max_per_paper: 5

hugo:
  output_dir: null # Hugo/前端仓库 content 目录；示例：/path/to/site/content。
  auto_push: false # 是否自动提交并推送 Hugo/前端仓库。
  build_knowledge_pages: true # 自动推送前，是否用最新知识库生成双语知识页并验证站点构建。
  knowledge_data_dir: null # 传给 KNOWLEDGE_DATA_DIR；为 null 时使用 knowledge.output_dir 或前端仓库 data/knowledge。
  knowledge_build_command: "npm run knowledge:demo" # 生成知识库网页内容的前端命令。
  site_build_command: "npm run build" # 推送前执行的前端构建验证命令。
  generated_content_paths: ["content/en/daily", "content/en/papers", "content/en/knowledge", "content/zh/daily", "content/zh/papers", "content/zh/knowledge"] # knowledge:demo 生成后要一并提交的内容目录。

display:
  max_paper_num: null # 邮件和 Hugo 展示上限；为 null 时使用 executor.max_paper_num。

reranker:
  local:
    model: jinaai/jina-embeddings-v5-text-nano # 本地 embedding 模型的 Hugging Face 名称。示例：jinaai/jina-embeddings-v5-text-nano
    encode_kwargs:
    # 传给本地 embedding 模型 encode 方法的参数，可参考 SentenceTransformers 文档。
      task: retrieval
      prompt_name: document
  api:
    key: null # embedding 模型 API Key。示例：sk-xxx
    base_url: null # embedding 模型 API 地址。示例：https://api.openai.com/v1
    model: null # embedding 模型名称。示例：text-embedding-3-large
    batch_size: null # embedding API 请求批大小，请按服务商限制调整。示例：64

executor:
  debug: false # 是否启用调试模式。示例：true
  send_empty: false # 当当天没有新论文或没有论文通过筛选时，是否仍发送空邮件/空日报。示例：false
  max_paper_num: 20 # 邮件和页面中展示的最大论文数量。示例：100
  longlist: null # 第二轮抓取全文和精排的候选数量；为 null 时默认取 max_paper_num 的 1.5 倍并向上取整。
  llm_concurrency: 5 # longlist 阶段生成双语 TL;DR 时的并发数；设为 1 表示顺序执行。
  score_threshold: 3.0 # 论文入选的最低相关度分数。示例：3.0
  source: ??? # 要抓取的论文来源，目前仅支持 ['arxiv']。
  reranker: local # 使用的重排序器。示例：'local' 或 'api'
  target_date: null # 要抓取的目标日期，格式为 YYYY-MM-DD；为 null 时抓取最新论文。示例："2026-05-01"
  target_date_source: auto # 指定日期候选发现来源。auto 会优先解析 arXiv catchup 网页，失败再回退 export API；可选 auto/catchup/api。
  start_date: null # 批量回溯的开始日期，格式为 YYYY-MM-DD；需要和 end_date 一起使用。
  end_date: null # 批量回溯的结束日期，格式为 YYYY-MM-DD；区间包含开始和结束两天。
  historical_mode: export_only # 批量回溯时的输出模式。export_only 只导出 Hugo；email_and_export 会同时发送邮件。
  continue_on_error: false # 批量回溯中某一天失败时，是否继续处理后续日期。
  skip_existing: false # 批量回溯时，如果中英文 Hugo 文件都已存在，是否跳过该日期。
  fetch_strict: true # arXiv 抓取完整性校验发现缺页或缺 ID 时，是否直接失败。
  zotero_max_attempts: 10 # Zotero API 遇到 DNS、连接或超时错误时的最大尝试次数，可覆盖约 14 分钟的短时断网。
  zotero_retry_base_seconds: 15 # Zotero API 网络错误首次重试前的等待秒数，之后指数增长。
  zotero_retry_max_seconds: 60 # Zotero API 单次重试等待的最大秒数。
  cross_validate_dailyarxiv: false # 是否用 dailyarxiv.com 的 query.php 对指定日期的 arXiv 结果做交叉验证。
  cross_validation_mode: warn # dailyarxiv 交叉验证不一致时的处理方式。示例：'warn' 或 'fail'
  arxiv_page_size: 800 # 指定日期抓取时 arXiv API 每页请求数量。
  arxiv_query_retries: 5 # 指定日期抓取时，arXiv API 分页请求遇到 429 或 5xx 时的最大尝试次数。
  arxiv_user_agent: "arXiv Daily: Nickelate Superconductors (support@jxchen.org)" # arXiv 请求使用的 User-Agent，包含项目名和联系邮箱。
  arxiv_proxy_enabled: false # 是否让 arXiv 请求走代理；默认直连。
  arxiv_proxy_url: null # arXiv 请求代理地址。V2rayN HTTP 示例：http://127.0.0.1:10809；SOCKS 示例：socks5h://127.0.0.1:10808
  arxiv_proxy_no_proxy: null # 可选 no_proxy 规则；设置后传给 requests 的代理配置。
  arxiv_request_interval_seconds: 5 # 所有 arXiv 请求之间的最小间隔秒数，保守遵守官方限速建议。
  arxiv_retry_base_seconds: 10 # arXiv API 分页请求重试的基础等待秒数，会按指数退避增长。
  arxiv_retry_max_seconds: 120 # arXiv API 分页请求单次重试等待的最大秒数。
  arxiv_429_cooldown_seconds: 300 # 多次遇到 429 后额外冷却等待秒数；如果响应含 Retry-After 则优先使用响应值。
  arxiv_429_cooldown_retries: 1 # 多次遇到 429 后额外冷却重试轮数。
  arxiv_failure_cooldown_seconds: 1800 # arXiv 连续失败后的保护性冷却秒数。
  arxiv_rss_retries: 5 # 最新论文 RSS 请求遇到连接超时、429 或 5xx 时的最大尝试次数。
  arxiv_rss_request_interval_seconds: 5 # 最新论文 RSS 请求之间的最小间隔秒数。
  arxiv_rss_cooldown_seconds: 300 # RSS 连续失败后额外冷却等待秒数。
  arxiv_rss_cooldown_retries: 1 # RSS 连续失败后额外冷却重试轮数。
  arxiv_metadata_batch_size: 20 # 从 RSS 获取 ID 后，批量查询 arXiv 元数据时的批大小。
  historical_day_cooldown_seconds: 600 # 批量回溯时，每个已处理日期和下个日期之间的冷却秒数。
  arxiv_cache_enabled: true # 是否启用 arXiv RSS、API 和全文提取结果的本地缓存。
  arxiv_cache_dir: outputs/cache/arxiv # arXiv 本地缓存目录。
  error_email_enabled: true # 是否在 arXiv 抓取异常、缺数或回溯单日失败时发送告警邮件。
